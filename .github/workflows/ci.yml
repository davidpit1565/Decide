name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  decidekit:
    name: DecideKit (engines and pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test
        working-directory: Packages/DecideKit
        run: swift test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install
        working-directory: Backend
        run: npm ci
      - name: Typecheck and test
        working-directory: Backend
        run: npm test
      - name: Fail if the Swift contract fixture drifted
        run: git diff --exit-code Packages/DecideKit/Tests/DecideCoreTests/Fixtures/backend_contract.json

  app:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild test \
            -project Decide.xcodeproj \
            -scheme Decide \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
