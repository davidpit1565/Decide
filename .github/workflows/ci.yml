name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A new push supersedes the one in flight instead of paying
# for both, and a PR no longer triggers a duplicate push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No test-only code or credentials can reach a shipping build
        run: python3 Scripts/check-release-hygiene.py

  decidekit:
    name: DecideKit (engines and pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Test
        working-directory: Packages/DecideKit
        run: swift test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install
        working-directory: Backend
        run: npm ci
      - name: Typecheck and test
        working-directory: Backend
        run: npm test
      - name: Fail if the Swift contract fixture drifted
        run: git diff --exit-code Packages/DecideKit/Tests/DecideCoreTests/Fixtures/backend_contract.json

  app:
    name: iOS app (${{ matrix.device }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # The largest current phone and the smallest supported one: layout has to
        # hold at both ends.
        device: ["iPhone 16", "iPhone SE (3rd generation)"]
    steps:
      - uses: actions/checkout@v4

      # Naming a device in the destination assumes the runner happens to have one
      # instantiated, which is not guaranteed and varies between images. Create
      # the device we want against whatever iOS runtime is installed.
      - name: Create the simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          runtime=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          runtimes = [
              r for r in json.load(sys.stdin)['runtimes']
              if r.get('isAvailable') and r.get('platform') == 'iOS'
          ]
          if not runtimes:
              sys.exit('No iOS simulator runtime is installed on this runner')
          print(sorted(runtimes, key=lambda r: r['version'])[-1]['identifier'])
          ")
          echo "Using runtime: $runtime"
          udid=$(xcrun simctl create "ci-${{ matrix.device }}" "${{ matrix.device }}" "$runtime")
          echo "Created ${{ matrix.device }} as $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Decide.xcodeproj \
            -scheme Decide \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
