# XcodeGen spec — the declarative source of truth for Decide.xcodeproj.
#
# The committed Decide.xcodeproj is generated from this file. If the project ever
# needs regenerating (merge conflict, Xcode upgrade), install XcodeGen and run:
#
#     xcodegen generate
#
name: Decide
options:
  bundleIdPrefix: com.decide
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  DecideKit:
    path: Packages/DecideKit

targets:
  Decide:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DecideKit
        product: DecideCore
      - package: DecideKit
        product: DecideFlow
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # INFOPLIST_FILE comes from Shared.xcconfig. Deliberately not using
        # XcodeGen's `info:` block, which would generate a plist over the top of
        # the real one.
        GENERATE_INFOPLIST_FILE: NO

  DecideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DecideAppTests
    dependencies:
      - target: Decide
      - package: DecideKit
        product: DecideCore
      - package: DecideKit
        product: DecideFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  DecideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/DecideUITests
    dependencies:
      - target: Decide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Decide:
    build:
      targets:
        Decide: all
    run:
      config: Debug
      storeKitConfiguration: Config/Decide.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DecideTests
        - DecideUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
